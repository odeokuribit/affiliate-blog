title: "おもちゃ最安値ナビ"
description: "子供向けおもちゃの最安値を比較！Amazon・楽天・Yahoo!の価格をまとめてチェックできます。"
url: "https://odeokuribit.github.io"
baseurl: "/affiliate-blog"

# ビルド設定
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# プラグイン
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ページネーション
paginate: 10
paginate_path: "/page:num/"

# 除外ファイル
exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - README.md
  - .github/

# デフォルト設定
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "編集部"
